<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#2d6a40">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essenza Prime">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essenza Prime — Esqueci minha senha</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d1a12;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }

  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob1 {
    width: 700px; height: 700px;
    background: radial-gradient(circle at 40% 60%, #2d6a4055, #1b4332aa);
    border-radius: 62% 38% 46% 54% / 60% 44% 56% 40%;
    top: -200px; left: -180px;
    animation: morph1 10s ease-in-out infinite;
  }
  .blob2 {
    width: 600px; height: 600px;
    background: radial-gradient(circle at 60% 40%, #40916c44, #1b433233);
    border-radius: 40% 60% 70% 30% / 50% 30% 70% 50%;
    bottom: -180px; right: -150px;
    animation: morph2 12s ease-in-out infinite;
  }
  .blob3 {
    width: 420px; height: 420px;
    background: radial-gradient(circle at 50% 50%, #52b78833, #2d6a4022);
    border-radius: 55% 45% 35% 65% / 45% 65% 35% 55%;
    bottom: -60px; left: 200px;
    animation: morph3 14s ease-in-out infinite;
  }

  @keyframes morph1 {
    0%,100% { border-radius: 62% 38% 46% 54% / 60% 44% 56% 40%; transform: translate(0,0); }
    50%      { border-radius: 40% 60% 55% 45% / 50% 60% 40% 50%; transform: translate(20px, 15px); }
  }
  @keyframes morph2 {
    0%,100% { border-radius: 40% 60% 70% 30% / 50% 30% 70% 50%; transform: translate(0,0); }
    50%      { border-radius: 60% 40% 30% 70% / 40% 70% 30% 60%; transform: translate(-15px, -20px); }
  }
  @keyframes morph3 {
    0%,100% { border-radius: 55% 45% 35% 65% / 45% 65% 35% 55%; transform: translate(0,0); }
    50%      { border-radius: 35% 65% 55% 45% / 65% 35% 65% 35%; transform: translate(10px, -10px); }
  }

  .wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 420px;
    padding: 0 24px;
  }

  .logo-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeDown 0.7s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-img {
    width: 250px;
    height: 250px;
    object-fit: contain;
    filter: drop-shadow(0 0 20px #40916c55);
  }

  .card {
    width: 100%;
    background: rgba(35, 50, 40, 0.85);
    border: 1px solid rgba(116, 198, 157, 0.35);
    border-radius: 20px;
    padding: 40px 36px 36px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow:
      0 24px 60px rgba(0,0,0,0.6),
      0 0 0 1px rgba(64,145,108,0.08) inset,
      0 1px 0 rgba(82,183,136,0.12) inset;
    animation: fadeUp 0.7s ease 0.15s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card h1 {
    font-size: 22px;
    font-weight: 600;
    color: #d8f3dc;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 400;
    color: #52b788;
    margin-bottom: 28px;
  }

  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #74c69d;
    margin-bottom: 8px;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 20px;
  }

  .input-wrap input {
    width: 100%;
    padding: 13px 44px 13px 42px;
    background: rgba(216, 243, 220, 0.12);
    border: 1px solid rgba(116, 198, 157, 0.35);
    border-radius: 10px;
    color: #d8f3dc;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  }

  .input-wrap input::placeholder { color: #95d5b2; }

  .input-wrap input:focus {
    border-color: #74c69d;
    background: rgba(216, 243, 220, 0.18);
    box-shadow: 0 0 0 3px rgba(64,145,108,0.14);
  }

  .icon-left {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #40916c;
    font-size: 17px;
    pointer-events: none;
  }

  .btn-enviar {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(135deg, #2d6a40, #40916c);
    border: none;
    border-radius: 10px;
    color: #d8f3dc;
    font-family: 'Inter';
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 18px rgba(64,145,108,0.28);
  }

  .btn-enviar:hover {
    background: linear-gradient(135deg, #40916c, #52b788);
    transform: translateY(-1px);
    box-shadow: 0 7px 24px rgba(64,145,108,0.4);
  }

  .btn-enviar:active { transform: translateY(0); }

  .voltar {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    font-weight: 400;
    color: #40916c;
    cursor: pointer;
    letter-spacing: 0.02em;
    text-decoration: none;
    transition: color 0.2s;
  }
  .voltar:hover { color: #74c69d; }

  .success-msg {
    color: #52b788;
    font-size: 12px;
    margin-bottom: 15px;
    text-align: center;
    display: none;
  }

  .error-msg {
    color: #ff6b6b;
    font-size: 12px;
    margin-bottom: 15px;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="wrapper">
    <div class="logo-area">
      <img class="logo-img" src="assets/logo.png">
    </div>

    <div class="card">
      <h1>Recuperar senha</h1>
      <p class="subtitle">Informe seu e-mail — o administrador será avisado para redefinir sua senha</p>

      <div id="success-box" class="success-msg">Solicitação enviada ao administrador.</div>
      <div id="error-box" class="error-msg">Informe um e-mail válido.</div>

      <label class="field-label" for="email">E-mail</label>
      <div class="input-wrap">
        <i class="ti ti-mail icon-left"></i>
        <input type="email" id="email" placeholder="seu@email.com">
      </div>

      <button class="btn-enviar" onclick="enviarRecuperacao()">Enviar</button>
      <a class="voltar" href="login.html">← Voltar ao login</a>
    </div>
  </div>

<script>
  async function enviarRecuperacao() {
    const email = document.getElementById('email').value.trim();
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');
    const btn = document.querySelector('.btn-enviar');

    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email || !emailRegex.test(email)) {
      errorBox.style.display = 'block';
      errorBox.textContent = 'Informe um e-mail válido.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
      const response = await fetch('http://localhost:8080/api/senha/esqueci', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await response.json();
      successBox.style.display = 'block';
      successBox.textContent = data.mensagem;
    } catch (e) {
      errorBox.style.display = 'block';
      errorBox.textContent = 'Não foi possível conectar ao servidor.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar';
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') enviarRecuperacao();
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
