# ========================================
# Essenza Prime Perfumaria - Configuração SQL Server
# ========================================

# Conexão SQL Server
# Altere host, porta, usuário e senha conforme seu ambiente
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Essenza_Prime_Perfumaria;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta do servidor
server.port=8080

# CORS (permitir frontend servido de qualquer porta em desenvolvimento)
spring.web.cors.allowed-origins=*

# Logging
logging.level.com.erp=DEBUG
logging.level.org.springframework.web=INFO

# Pasta onde os backups serão salvos (a barra precisa ser dupla no .properties)
app.backup.dir=C:\\Backups
